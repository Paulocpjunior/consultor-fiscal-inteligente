name: Deploy Firestore + Storage (rules + indexes)

# Publica as REGRAS e os ÍNDICES do Firestore automaticamente — antes isso só
# saía por `firebase deploy` manual na máquina de alguém, então correções de
# regra (ex.: perda de dados em simples_notas) e índices compostos podiam ficar
# no repositório sem nunca chegar à produção. O deploy do app (Cloud Run) NÃO
# cobre isso; este workflow fecha a lacuna reaproveitando o mesmo GCP_SA_KEY.
#
# Dispara só quando os arquivos do Firestore mudam (ou manualmente).

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - storage.rules
      - firebase.json
  workflow_dispatch: {}

concurrency:
  group: deploy-firestore
  cancel-in-progress: false

# Run vermelho num painel que ninguém abre não é aviso. Issue é (13/08).
permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: Deploy rules & indexes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        # Mesma credencial que o deploy-app usa. O SA precisa ter permissão de
        # deploy do Firestore: roles/firebaserules.admin + roles/datastore.indexAdmin
        # (ou roles/firebase.admin). Se faltar, o passo abaixo falha com erro de
        # permissão claro apontando a role a conceder.
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy Firestore rules + indexes + Storage rules
        # ADC: o auth@v2 exporta GOOGLE_APPLICATION_CREDENTIALS, que o
        # firebase-tools consome. --non-interactive SEM --force: publica/atualiza
        # regras e índices mas NUNCA apaga índices ausentes do arquivo (evita o
        # incidente de deleção acidental de índices via prompt "Yes").
        #
        # 🚨 `storage` ENTROU EM 01/09 — e ele faltava desde sempre.
        #
        # Em 31/08 a regra de `/nfse_pdfs/{empresaId}/{file}` foi escrita para
        # destravar a importação de NFS-e em PDF (Prefeitura de Santo André),
        # o `firebase.json` já declarava `"storage": {"rules": "storage.rules"}`
        # … e **nenhum workflow publicava esse arquivo**. No dia seguinte o
        # colaborador levou EXATAMENTE o mesmo `storage/unauthorized`: a regra
        # estava no repositório e nunca chegou à produção.
        #
        # 📌 É a lição de 13/08 um nível acima — *"regra escrita não é regra
        # LIGADA"* virou *"regra escrita não é regra IMPLANTADA"*. O comentário
        # no topo deste workflow já dizia que ele existe porque correções de
        # regra "podiam ficar no repositório sem nunca chegar à produção"; ele
        # fechou essa lacuna no Firestore e deixou o Storage aberto.
        run: |
          npx -y firebase-tools@13.35.1 deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project consultorfiscalapp \
            --non-interactive

  # ═══ REDE DE SEGURANÇA — o MESMO desenho do deploy-app.yml ═══════════════
  # "Toda workflow que a casa depende nasce com o `if: failure()` que vira
  # issue" (17/08). Job PRÓPRIO com `needs`, e ZERO `uses:`: em 17/08 o
  # deploy 566 caiu em "Prepare all required actions" (o GitHub devolveu
  # 429/503 ao baixar uma action) e NENHUM passo do job rodou — inclusive o
  # avisador, que morava dentro dele. O `gh` já vem no runner.
  # Dispara em falha E em cancelamento (cota da conta cancela aos 15m sem
  # executar nada, e isso é tão invisível quanto falha).
  avisar-falha:
    needs: deploy
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Deploy falhou — abrir/atualizar issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dado de fora entra por `env:`, nunca por `${{ }}` dentro do
          # script — a mensagem do commit vira CÓDIGO no bash (13/08, deploy 470).
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          RESULTADO: ${{ needs.deploy.result }}
        run: |
          TITULO="🚨 Deploy do Firestore/Storage (rules + índices) FALHOU — regra escrita não é regra implantada"
          # Só a PRIMEIRA linha da mensagem: squash é um muro de texto.
          RESUMO=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          {
            printf 'O workflow terminou em **%s**.\n\n' "$RESULTADO"
            printf '**As regras/índices mesclados NÃO estão em produção.** O `firestore.rules`, o `storage.rules` e o `firestore.indexes.json` do repositório são o que DEVERIA valer — a produção continua com a versão anterior.\n\n'
            printf 'Consequência típica: a correção de regra existe no repo e o colaborador leva o MESMO `permission-denied` / `storage/unauthorized` no dia seguinte (foi assim em 01/09 com o `nfse_pdfs/`); índice composto novo ausente faz a consulta responder `failed-precondition`, e a tela engole como lista vazia.\n\n'
            printf '| | |\n| --- | --- |\n'
            printf '| Commit | `%s` |\n' "$COMMIT_SHA"
            printf '| Mensagem | %s |\n' "$RESUMO"
            printf '| Resultado | %s |\n' "$RESULTADO"
            printf '| Run | %s |\n\n' "$RUN_URL"
            printf '**O que fazer**\n'
            printf '1. Abrir o run e ver QUAL passo caiu (o log diz).\n'
            printf '2. Permissão da service account (`firebaserules.admin` / `datastore.indexAdmin`): conceder e reexecutar.\n'
            printf '3. Regra inválida: o `firebase deploy` aponta a linha — corrigir e mesclar de novo.\n'
            printf '4. Infraestrutura (download de action, runner, cota): reexecutar o run.\n'
            printf '   Saída de emergência: `npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage --project consultorfiscalapp` na máquina de alguém autenticado.\n'
            printf '\n_Esta issue é fechada à mão quando o deploy voltar a passar._\n'
          } > /tmp/corpo-issue.md
          EXISTE=$(gh issue list --repo "$REPO" --search "$TITULO in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTE" ]; then
            # Uma issue por incidente: falhar de novo COMENTA.
            gh issue comment "$EXISTE" --repo "$REPO" --body-file /tmp/corpo-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITULO" --body-file /tmp/corpo-issue.md
          fi

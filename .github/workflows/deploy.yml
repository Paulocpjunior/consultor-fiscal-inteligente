name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - claude/update-claude-code-cli-nmlTI

env:
  PROJECT_ID: consultorfiscalapp
  SERVICE_NAME: consultor-fiscal-inteligente
  REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: consultorfiscalapp

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_SEFAZ_BACKEND_URL: ${{ secrets.VITE_SEFAZ_BACKEND_URL }}
        run: |
          docker build \
            --build-arg VITE_GEMINI_API_KEY="$VITE_GEMINI_API_KEY" \
            --build-arg VITE_FIREBASE_API_KEY="$VITE_FIREBASE_API_KEY" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="$VITE_FIREBASE_AUTH_DOMAIN" \
            --build-arg VITE_FIREBASE_PROJECT_ID="$VITE_FIREBASE_PROJECT_ID" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="$VITE_FIREBASE_STORAGE_BUCKET" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="$VITE_FIREBASE_MESSAGING_SENDER_ID" \
            --build-arg VITE_FIREBASE_APP_ID="$VITE_FIREBASE_APP_ID" \
            --build-arg VITE_SEFAZ_BACKEND_URL="$VITE_SEFAZ_BACKEND_URL" \
            -t us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/consultor-fiscal-inteligente:${{ github.sha }} \
            .

      - name: Push to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/consultor-fiscal-inteligente:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy consultor-fiscal-inteligente \
            --image us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/consultor-fiscal-inteligente:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10

      - name: Show Service URL
        run: |
          gcloud run services describe consultor-fiscal-inteligente \
            --platform managed \
            --region us-central1 \
            --format 'value(status.url)'

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: consultorfiscalapp
  SERVICE_NAME: consultor-fiscal-inteligente
  REGION: us-west1

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: consultorfiscalapp

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck || echo "::warning::TypeScript errors found (non-blocking)"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            .

      - name: Push to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --update-secrets=GEMINI_API_KEY=gemini-api-key:latest,GRAPH_CLIENT_SECRET=graph-client-secret:latest

      - name: Show Service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)'

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: consultorfiscalapp
  SERVICE_NAME: consultor-fiscal-inteligente
  REGION: us-west1

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: consultorfiscalapp

      - name: Install dependencies
        run: npm ci

      # Gate BLOQUEANTE: sintaxe do backend. Pega a classe de bug que REALMENTE
      # derruba produção (erro de sintaxe em server.js / sefaz-backend/*.js —
      # já houve incidentes). node --check é syntax-only (não resolve imports),
      # rápido e determinístico. Se algum arquivo não parsear, o deploy PARA.
      - name: Backend syntax check (blocking)
        run: |
          fail=0
          for f in $(find server.js sefaz-backend proxy-backend -path '*/node_modules' -prune -o -name '*.js' -print); do
            node --check "$f" || { echo "::error file=$f::Erro de sintaxe"; fail=1; }
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Backend tem erro(s) de sintaxe — deploy abortado."
            exit 1
          fi
          echo "✓ Backend OK (sintaxe)"

      - name: Type check
        run: npm run typecheck

      - name: Type check strict (noUncheckedIndexedAccess)
        # Subset opt-in (tsconfig.strict.json). Migracao incremental:
        # arquivo migrado -> entra no include do tsconfig.strict.json.
        # Issue #101 trackeia ate cobrir 100% do codebase.
        run: npm run lint:strict

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Proxy dependency audit
        run: npm audit --prefix proxy-backend --audit-level=moderate

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        # VITE_SENTRY_DSN injetado como --build-arg pra o Vite incluir no
        # bundle (telemetria frontend). Se o secret SENTRY_DSN nao existir no
        # repo, vira string vazia — app roda sem Sentry (services/sentry.ts
        # vira NO-OP). Pra ativar: GitHub repo → Settings → Secrets → Actions
        # → New: SENTRY_DSN = <dsn do projeto frontend no Sentry>.
        run: |
          docker build \
            --build-arg VITE_SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --build-arg VITE_SENTRY_ENV="production" \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}" \
            -t us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            .

      - name: Push to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --no-cpu-throttling \
            --update-env-vars=GRAPH_CLIENT_ID=59fd4ec9-37bd-472c-9fa7-373461dffd50,GRAPH_TENANT_ID=8b8254a4-9a63-4c2d-81a2-577942081943,GRAPH_REMETENTE=junior@spassessoriacontabil.com.br,DAS_MODE=serpro,DARF_MODE=serpro,DCTFWEB_MODE=serpro,CAIXA_POSTAL_MODE=serpro,NFSE_NAC_MODE=serpro,SERPRO_CONTRATANTE_CNPJ=44388152000189,EMISSAO_BLOQUEADA=false,EMISSAO_BLOQUEADA_DARF=true,EMISSAO_BLOQUEADA_DCTFWEB=true,EMISSAO_BLOQUEADA_NFSE_NAC=true,NFSE_NAC_EMISSAO_AMB=homologacao \
            --update-secrets=GEMINI_API_KEY=gemini-api-key:latest,GRAPH_CLIENT_SECRET=graph-client-secret:latest,SERPRO_CONSUMER_KEY=serpro-consumer-key:latest,SERPRO_CONSUMER_SECRET=serpro-consumer-secret:latest,SEFAZ_CRON_SECRET=sefaz-cron-secret:latest,SHAREPOINT_PROXY_TOKEN=sharepoint-proxy-token:latest

      - name: Deploy Firestore & Storage rules
        # Publica firestore.rules + storage.rules + indexes usando a MESMA
        # service account do deploy (google-github-actions/auth exporta
        # GOOGLE_APPLICATION_CREDENTIALS, que o firebase-tools usa pra ADC).
        # ANTES: nada publicava as rules — firebase.json apontava pra
        # storage.rules inexistente e o pipeline só subia o Cloud Run.
        # Resultado: regras de Firestore/Storage podiam ficar defasadas em prod.
        # Se falhar por permissao, conceda roles/firebaserules.admin
        # (+ datastore.indexAdmin p/ indexes) a SA do GCP_SA_KEY.
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project consultorfiscalapp \
            --non-interactive

      - name: Show Service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)'

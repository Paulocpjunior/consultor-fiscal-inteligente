name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: consultorfiscalapp
  SERVICE_NAME: consultor-fiscal-inteligente
  REGION: us-west1

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: consultorfiscalapp

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck || echo "::warning::TypeScript errors found (non-blocking)"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            .

      - name: Push to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --no-cpu-throttling \
            --update-env-vars=GRAPH_CLIENT_ID=59fd4ec9-37bd-472c-9fa7-373461dffd50,GRAPH_TENANT_ID=8b8254a4-9a63-4c2d-81a2-577942081943,GRAPH_REMETENTE=junior@spassessoriacontabil.com.br,DAS_MODE=serpro,DARF_MODE=serpro,DCTFWEB_MODE=serpro,CAIXA_POSTAL_MODE=serpro,NFSE_NAC_MODE=serpro,SERPRO_CONTRATANTE_CNPJ=44388152000189 \
            --update-secrets=GEMINI_API_KEY=gemini-api-key:latest,GRAPH_CLIENT_SECRET=graph-client-secret:latest,SERPRO_CONSUMER_KEY=serpro-consumer-key:latest,SERPRO_CONSUMER_SECRET=serpro-consumer-secret:latest,SEFAZ_CRON_SECRET=sefaz-cron-secret:latest

      - name: Deploy Firestore & Storage rules
        # Publica firestore.rules + storage.rules + indexes usando a MESMA
        # service account do deploy (google-github-actions/auth exporta
        # GOOGLE_APPLICATION_CREDENTIALS, que o firebase-tools usa pra ADC).
        # ANTES: nada publicava as rules — firebase.json apontava pra
        # storage.rules inexistente e o pipeline só subia o Cloud Run.
        # Resultado: regras de Firestore/Storage podiam ficar defasadas em prod.
        # continue-on-error: nao bloqueia o deploy do app. Se falhar por
        # permissao, conceda roles/firebaserules.admin (+ datastore.indexAdmin
        # p/ indexes) a SA do GCP_SA_KEY e o aviso some.
        continue-on-error: true
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project consultorfiscalapp \
            --non-interactive \
          || echo "::warning::Falha ao publicar regras Firebase. Conceda roles/firebaserules.admin a SA do GCP_SA_KEY."

      - name: Show Service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)'

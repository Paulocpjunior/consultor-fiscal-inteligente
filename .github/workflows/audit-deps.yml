# Robô diário de dependências.
#
# POR QUE EXISTE: o gate do deploy já barrou 3 entregas por advisory publicado
# ENTRE deploys (postcss 24/07, brace-expansion 25/07 e 03/08) — nenhuma delas
# tinha relação com o código que estava sendo entregue. Descobrir isso na hora
# do deploy é o pior momento possível: a correção fiscal fica parada esperando
# uma atualização de biblioteca.
#
# O QUE FAZ: todo dia útil de manhã roda a auditoria; havendo advisory
# high/critical, tenta corrigir (`npm audit fix`, sem --force), VALIDA com a
# mesma bateria do deploy (lint + jest + build) e só então abre um PR já
# testado. Se não houver correção possível, abre uma ISSUE avisando ANTES de
# alguém esbarrar no bloqueio.
#
# Nunca commita direto na main (regra do projeto) e nunca usa --force: upgrade
# de major entra por decisão humana, não por robô de madrugada.
name: Auditoria diária de dependências

on:
  schedule:
    # 09:00 UTC = 06:00 BRT, dias úteis — pronto antes do expediente.
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: audit-deps
  cancel-in-progress: false

jobs:
  auditar:
    name: Auditar e corrigir
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auditoria
        id: auditoria
        run: |
          if npm audit --audit-level=high > /tmp/audit.txt 2>&1; then
            echo "limpo=true" >> "$GITHUB_OUTPUT"
            echo "→ Nenhum advisory high/critical."
          else
            echo "limpo=false" >> "$GITHUB_OUTPUT"
            cat /tmp/audit.txt
          fi

      - name: Tentar correção automática
        if: steps.auditoria.outputs.limpo == 'false'
        id: correcao
        run: |
          # Sem --force: major com breaking change é decisão humana.
          # E sem `npm install --package-lock-only` depois: re-resolver o lock
          # pode DESFAZER a correção que o audit fix acabou de aplicar.
          npm audit fix || true

          if git diff --quiet -- package-lock.json package.json; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "→ npm audit fix não alterou nada (sem correção upstream)."
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

          if npm audit --audit-level=high > /tmp/audit-depois.txt 2>&1; then
            echo "resolvido=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolvido=false" >> "$GITHUB_OUTPUT"
            cat /tmp/audit-depois.txt
          fi

      # Só abre PR de algo que PASSA na mesma bateria do deploy — PR vermelho
      # seria só mais uma pendência na fila do humano.
      - name: Validar (lint + testes + build)
        if: steps.correcao.outputs.mudou == 'true'
        id: validacao
        run: |
          npm ci
          npm run lint
          npx jest --ci
          npm run build

      - name: Abrir PR com a correção
        if: steps.correcao.outputs.mudou == 'true' && steps.validacao.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/audit-deps"
          HOJE=$(date +%d/%m/%Y)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Traz a ref remota da branch do robô ANTES de recriá-la.
          # Sem isto o `--force-with-lease` recusa com "stale info" (ele não tem
          # com o que comparar) e o fallback simples recusa com "fetch first"
          # (não é fast-forward) — os DOIS caminhos falham, que foi exatamente o
          # que travou o robô de 14 a 17/08, todo dia, em silêncio.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true

          git checkout -B "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(deps): correcao automatica de advisory ($HOJE)

          Aberto pelo robo diario de auditoria. Rodou npm audit fix (sem --force)
          e validou com lint + jest + build antes de abrir o PR.

          Auditoria depois da correcao:
          $(sed 's/^/  /' /tmp/audit-depois.txt | head -30)"
          # A branch é exclusiva do robô. force-with-lease protege de sobrescrever
          # trabalho alheio; no 1º run a branch não existe no remoto, daí o fallback.
          git push --force-with-lease origin "$BRANCH" || git push origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "→ PR já aberto para $BRANCH; branch atualizada."
            exit 0
          fi

          if gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "chore(deps): correção automática de advisory ($HOJE)" \
              --body "$(cat <<'CORPO'
          Robô diário de auditoria. `npm audit fix` (sem `--force`) resolveu um advisory
          high/critical **antes** que ele pudesse barrar um deploy.

          Já validado neste mesmo run: `npm run lint`, `npx jest --ci` e `npm run build`.

          Confira o diff do `package-lock.json` e mescle. Se o advisory for de dependência
          de produção, isto está segurando o próximo deploy — prioridade.
          CORPO
          )"; then
            exit 0
          fi

          # ─── O PR NÃO PÔDE SER ABERTO ────────────────────────────────────────
          # Aconteceu de verdade em 07/08: "GitHub Actions is not permitted to
          # create or approve pull requests" — uma configuração do repositório,
          # não um defeito do código. O robô morria aqui, e o efeito era o pior
          # possível: a CORREÇÃO ficava pronta numa branch que ninguém sabia que
          # existia, e o run vermelho diário não dizia o que fazer.
          #
          # Agora a falha vira uma ISSUE — durável e acionável. O run continua
          # VERMELHO de propósito: a correção não foi entregue, e run verde aqui
          # seria dizer que foi.
          echo "::warning::gh pr create falhou — abrindo issue com o caminho manual."
          TITULO="Robô de auditoria não consegue abrir PR"
          CORPO_ISSUE=$(cat <<CORPO
          O robô diário corrigiu um advisory e **empurrou a branch \`$BRANCH\`**, mas não
          conseguiu abrir o PR. A correção existe e está parada.

          **Causa mais provável** (foi a de 07/08): o repositório não permite que o GitHub
          Actions abra pull requests.

          **Como resolver, uma vez só:**
          Settings → Actions → General → Workflow permissions →
          marcar **"Allow GitHub Actions to create and approve pull requests"**.

          **Enquanto isso, o PR sai à mão:**
          https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1

          Auditoria depois da correção:
          \`\`\`
          $(sed 's/^/  /' /tmp/audit-depois.txt | head -30)
          \`\`\`
          CORPO
          )
          EXISTE=$(gh issue list --search "$TITULO in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTE" ]; then
            gh issue comment "$EXISTE" --body "$CORPO_ISSUE"
          else
            gh issue create --title "$TITULO" --body "$CORPO_ISSUE"
          fi
          exit 1

      # Sem correção possível: avisa ANTES de virar bloqueio de deploy.
      - name: Abrir issue quando não há correção
        if: steps.correcao.outputs.mudou == 'false' || steps.correcao.outputs.resolvido == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITULO="Advisory sem correção automática nas dependências"
          EXISTE=$(gh issue list --search "$TITULO in:title" --state open --json number --jq '.[0].number // empty')
          CORPO=$(cat <<CORPO
          O \`npm audit fix\` não resolveu sozinho. Enquanto isso não for tratado, um
          advisory de **produção** vai barrar o próximo deploy (dep de desenvolvimento
          não bloqueia, mas continua pendente).

          Caminhos, nesta ordem:
          1. Subir o PISO da faixa em \`overrides\` do package.json (nunca versão exata —
             pino exato cria teto e trava o audit fix).
          2. Atualizar a dependência direta que puxa a vulnerável.
          3. Sem correção upstream: \`[skip-audit]\` no assunto do commit libera a entrega,
             com o risco registrado no PR.

          \`\`\`
          $(cat /tmp/audit-depois.txt 2>/dev/null || cat /tmp/audit.txt)
          \`\`\`
          CORPO
          )

          if [ -n "$EXISTE" ]; then
            gh issue comment "$EXISTE" --body "$CORPO"
          else
            gh issue create --title "$TITULO" --body "$CORPO"
          fi

  # ═══ REDE DE SEGURANÇA — JOB PRÓPRIO, não um passo do mesmo job ═════════
  # O robô caiu por um motivo que ele mesmo não previu (git, rede, cota)?
  # Então NADA acima abriu issue, e o run vermelho fica num painel que
  # ninguém abre — que é a definição de aviso que não avisa.
  #
  # Foi o que aconteceu de 14 a 17/08: o push era rejeitado, o step morria
  # com exit 1 ANTES do passo que abre issue, e o robô de SEGURANÇA ficou
  # três dias quebrado sem ninguém saber. Só apareceu porque o Paulo olhou
  # a lista de runs.
  #
  # 🚨 E ATÉ 03/09 ESTE AVISO ERA UM PASSO DENTRO DO MESMO JOB — o modo de
  # falha que ele denuncia. Se o job morre ANTES de qualquer passo rodar
  # ("Prepare all required actions" com 429/503 do GitHub ao baixar
  # `actions/checkout`, o deploy 566 de 17/08), ou é CANCELADO pela cota da
  # conta, o passo `if: failure()` nem executa. Job separado com `needs` roda
  # de qualquer jeito; sem `uses:` porque é justamente o download de action
  # que falha; `gh` já vem no runner. É o mesmo desenho do deploy-app.yml.
  avisar-falha:
    needs: auditar
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Robô falhou por outro motivo — abrir/atualizar issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTADO: ${{ needs.auditar.result }}
          REPO: ${{ github.repository }}
        run: |
          TITULO="Robô de auditoria de dependências falhou"
          CORPO=$(cat <<CORPO
          O robô diário terminou em **${RESULTADO}** antes de concluir, então nenhum
          dos avisos dele rodou — e o advisory que ele ia corrigir continua de pé.

          · Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          · Commit: ${GITHUB_SHA}

          **Causas já vistas aqui, em ordem de probabilidade:**
          1. \`push\` da branch \`chore/audit-deps\` rejeitado (a branch remota
             divergiu). Corrigido em 17/08 com \`fetch\` antes do
             \`--force-with-lease\`; se voltar, é outra coisa.
          2. O repositório não permite que o Actions abra pull request
             (Settings → Actions → General → Workflow permissions).
          3. Falha de rede/cota do runner — costuma passar sozinha no dia seguinte.
             Cancelado aos 15m00s sem passo executado = cota da conta (06/08).

          ⚠️ Enquanto esta issue estiver aberta, **o robô não está protegendo
          nada**: a correção de advisory depende de alguém rodar à mão.
          CORPO
          )
          EXISTE=$(gh issue list --repo "$REPO" --search "$TITULO in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTE" ]; then
            gh issue comment "$EXISTE" --repo "$REPO" --body "$CORPO"
          else
            gh issue create --repo "$REPO" --title "$TITULO" --body "$CORPO"
          fi

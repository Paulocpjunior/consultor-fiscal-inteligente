# Deploy do APP PRINCIPAL (frontend + server.js + sefaz-backend) no Cloud Run.
#
# Antes o deploy era 100% manual (script 03-deploy.sh na máquina do admin),
# o que deixava correções mescladas na main paradas sem publicar — e falhava
# junto com o ambiente local (git lock, gcloud quebrado). Este workflow usa a
# MESMA service account do deploy do proxy (secret GCP_SA_KEY).
#
# Config do frontend (VITE_*): resolvida por scripts/extract-prod-frontend-
# config.mjs — GitHub Secrets têm prioridade; sem eles, extrai do bundle já
# publicado (config web do Firebase é pública por design).
#
# O `gcloud run deploy` passa SÓ a imagem: env vars, secrets, memória, service
# account e demais configs do serviço são PRESERVADOS da revisão atual.
name: Deploy App Principal

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'proxy-backend/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch:

# MATA-BURRO: DEPLOY QUE FALHA NÃO PODE PASSAR BATIDO.
#
# Em 12/08/2026 dois deploys do app irmão falharam seguidos e ninguém viu: o
# trabalho ficou mesclado na main e FORA DO AR, e a descoberta veio de um print
# de tela desatualizada — depois de tempo gasto procurando um defeito que já
# estava corrigido.
#
# Run vermelho num painel que ninguém abre não é aviso. Issue é.
permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-app-principal
  cancel-in-progress: false

env:
  PROJECT_ID: consultorfiscalapp
  SERVICE_NAME: consultor-fiscal-inteligente
  REGION: us-west1
  IMAGE: us-central1-docker.pkg.dev/consultorfiscalapp/cloud-run-deploy/consultor-fiscal-inteligente
  PROD_URL: https://consultor-fiscal-inteligente-631239634290.us-west1.run.app

jobs:
  deploy:
    name: Build & Deploy App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auditoria de dependências (bloqueia em high/critical de PRODUÇÃO)
        # Trava o deploy se surgir advisory high/critical no que REALMENTE VAI NA
        # IMAGEM (--omit=dev). Vulns transitivas sem fix upstream são fixadas via
        # "overrides" no package.json — sempre em FAIXA (^x.y.z), nunca versão
        # exata: pino exato cria teto e impede o `npm audit fix` de resolver
        # sozinho quando o próprio pinado ganha advisory (3 deploys caíram assim
        # — postcss 24/07, brace-expansion 25/07 e 03/08).
        #
        # Advisory em dep de DESENVOLVIMENTO não bloqueia: ferramenta de build não
        # roda no Cloud Run, e segurar a entrega de imposto por causa dela custa
        # mais do que resolve (Paulo, 03/08 — "estamos FULL SERVICE"). Ela vai pro
        # resumo do job e quem cobra o conserto é o robô diário (audit-deps.yml),
        # que abre PR já testado antes de virar bloqueio.
        #
        # Escape hatch: `[skip-audit]` no ASSUNTO (1ª linha) do commit libera um
        # hotfix urgente. Checamos só o assunto (git log --pretty=%s), não o corpo
        # — assim a DESCRIÇÃO de um PR que apenas MENCIONE o marcador não aciona o
        # skip por acidente (footgun do contains(head_commit.message)).
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          if printf '%s' "$SUBJECT" | grep -qF '[skip-audit]'; then
            echo "→ [skip-audit] no assunto do commit — auditoria pulada (hotfix)."
            exit 0
          fi

          if ! npm audit --omit=dev --audit-level=high; then
            echo "::error::Advisory high/critical em dependência de PRODUÇÃO — vai dentro da imagem."
            cat >&2 <<'ACAO'

          COMO RESOLVER (nesta ordem):
            1. npm audit fix          → resolve sozinho quando há versão corrigida
            2. se um "overrides" do package.json estiver segurando a versão velha,
               suba o PISO da faixa (ex.: "^5.0.8" -> "^5.0.9") e rode npm install
            3. sem correção upstream: [skip-audit] no assunto do commit libera o
               deploy e o risco fica registrado no PR — use só se a entrega não
               puder esperar.
          ACAO
            exit 1
          fi

          # Árvore completa (inclui dev): informativo, nunca bloqueia.
          if ! npm audit --audit-level=high > /tmp/audit-dev.txt 2>&1; then
            echo "::warning::Advisory high/critical em dependência de DESENVOLVIMENTO — não bloqueia o deploy; o robô diário abre o PR de correção."
            {
              echo "### ⚠️ Auditoria — dependência de desenvolvimento"
              echo "Não bloqueia o deploy (não vai na imagem). O robô \`audit-deps.yml\` abre PR de correção."
              echo '```'
              cat /tmp/audit-dev.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Typecheck + testes
        run: |
          npm run lint
          npx jest --ci

      - name: Resolver config do frontend (VITE_*)
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENV: ${{ secrets.VITE_SENTRY_ENV }}
        run: node scripts/extract-prod-frontend-config.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: consultorfiscalapp

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build app Docker image
        run: |
          docker build \
            --build-arg VITE_GEMINI_API_KEY="$VITE_GEMINI_API_KEY" \
            --build-arg VITE_FIREBASE_API_KEY="$VITE_FIREBASE_API_KEY" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="$VITE_FIREBASE_AUTH_DOMAIN" \
            --build-arg VITE_FIREBASE_PROJECT_ID="$VITE_FIREBASE_PROJECT_ID" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="$VITE_FIREBASE_STORAGE_BUCKET" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="$VITE_FIREBASE_MESSAGING_SENDER_ID" \
            --build-arg VITE_FIREBASE_APP_ID="$VITE_FIREBASE_APP_ID" \
            --build-arg VITE_FIREBASE_VAPID_KEY="$VITE_FIREBASE_VAPID_KEY" \
            --build-arg VITE_SENTRY_DSN="$VITE_SENTRY_DSN" \
            --build-arg VITE_SENTRY_ENV="$VITE_SENTRY_ENV" \
            --build-arg APP_COMMIT="${{ github.sha }}" \
            --build-arg APP_BUILD_NUMBER="${{ github.run_number }}" \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            .

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run (sem tráfego, revisão candidata)
        # --no-traffic + --tag candidate: cria a revisão nova SEM mandar tráfego
        # de produção pra ela. Assim validamos a saúde da candidata ANTES de
        # rotear — se ela subir quebrada, a revisão antiga continua servindo 100%
        # (rollback automático, ninguém vê erro). Antes o deploy roteava tráfego
        # imediatamente e o health check só rodava DEPOIS (tarde demais).
        # Retry: o Cloud Run aborta com "ABORTED: Conflict for resource" quando
        # outra operação tocou o serviço entre leitura e gravação (transitório).
        run: |
          for attempt in 1 2 3; do
            if gcloud run deploy ${{ env.SERVICE_NAME }} \
              --image ${{ env.IMAGE }}:${{ github.sha }} \
              --platform managed \
              --region ${{ env.REGION }} \
              --update-env-vars=WHATSAPP_PHONE_NUMBER_ID=1167203206473367,WHATSAPP_TEMPLATE_GUIA=envio_guia_imposto \
              --update-secrets=WHATSAPP_CLOUD_TOKEN=whatsapp-cloud-token:latest \
              --no-traffic --tag candidate \
              --quiet; then
              exit 0
            fi
            echo "Deploy falhou (tentativa ${attempt}/3) — aguardando antes de repetir..."
            sleep $((attempt * 15))
          done
          echo "Deploy falhou após 3 tentativas."
          exit 1

      - name: Health check da revisão candidata (antes de rotear)
        # Bate no /ready (readiness ESTRITO — 503 se o Firestore está quebrado) da
        # URL EXCLUSIVA da candidata (tag). Diferente do /health, que responde 200
        # só de o processo estar de pé, o /ready barra revisão que sobe mas não
        # fala com a dependência essencial. Se falhar, o job falha aqui e o tráfego
        # NUNCA é roteado — a revisão antiga segue 100%. Retenta pra cold-start.
        run: |
          CANDIDATE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed --region ${{ env.REGION }} \
            --format=json | jq -r '.status.traffic[] | select(.tag=="candidate") | .url' | head -n1)
          if [ -z "$CANDIDATE_URL" ]; then
            echo "Não achei a URL da revisão candidata (tag=candidate)."; exit 1
          fi
          echo "Revisão candidata: $CANDIDATE_URL"
          for attempt in 1 2 3 4 5; do
            if curl -sSf "$CANDIDATE_URL/ready" > /dev/null; then
              echo "✓ /ready OK na candidata (processo + Firestore)"
              curl -sSf "$CANDIDATE_URL/version.json" || echo "(version.json indisponível)"
              exit 0
            fi
            echo "ready ainda não respondeu OK (tentativa ${attempt}/5)…"
            sleep $((attempt * 5))
          done
          echo "✗ Candidata NÃO passou no /ready — tráfego não roteado (revisão antiga segue ativa)."
          exit 1

      - name: Rotear tráfego para a candidata (health OK)
        # Só chega aqui se o /ready passou. Roteia 100% para a EXATA revisão
        # validada, pelo NOME da revisão (não `--to-latest`) — assim um deploy
        # concorrente fora de banda que criasse uma revisão mais nova entre o
        # health e este passo não sequestraria o tráfego. O --remove-tags na mesma
        # chamada limpa a tag candidate atomicamente. Retry: mesmo ABORTED
        # transitório de conflito que o passo de deploy trata.
        run: |
          REV=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed --region ${{ env.REGION }} \
            --format=json | jq -r '.status.traffic[] | select(.tag=="candidate") | .revisionName' | head -n1)
          if [ -z "$REV" ]; then
            echo "Não achei a revisão candidata (tag=candidate) para rotear."; exit 1
          fi
          echo "Roteando 100% para a revisão validada: $REV"
          for attempt in 1 2 3; do
            if gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --to-revisions "${REV}=100" \
              --remove-tags candidate \
              --platform managed --region ${{ env.REGION }} --quiet; then
              exit 0
            fi
            echo "update-traffic falhou (tentativa ${attempt}/3) — aguardando…"
            sleep $((attempt * 15))
          done
          echo "✗ update-traffic falhou após 3 tentativas (revisão antiga segue ativa)."
          exit 1

      - name: Health check final (produção)
        run: |
          sleep 5
          echo "── /health ──"
          curl -sSf "${{ env.PROD_URL }}/health"
          echo ""
          echo "── /version.json ──"
          curl -sSf "${{ env.PROD_URL }}/version.json" || echo "(version.json indisponível)"

  # ══════════════════════════════════════════════════════════════════════════
  # A TRAVA — e ela vive num JOB SEPARADO de propósito.
  #
  # 🚨 17/08: o deploy 566 caiu em **"Prepare all required actions"** (o GitHub
  # devolveu 429 e depois 503 ao baixar `google-github-actions/auth`). Nenhum
  # passo do job rodou — inclusive o passo que abre a issue, que morava DENTRO
  # do mesmo job. Resultado: o trabalho ficou mesclado na main e FORA DO AR, e
  # ninguém foi avisado. É o cenário exato de 12/08, pela terceira vez.
  #
  # REGRA QUE FICA: **o avisador não pode compartilhar o modo de falha que ele
  # denuncia.** Falha no SETUP do job mata todos os passos dele, então o aviso
  # sai num job próprio, com `needs`, e usa SÓ o que já vem no runner (`gh`) —
  # zero `uses:`, porque a falha que estamos cobrindo é justamente o download
  # de action. Sem checkout também: o corpo da issue não precisa do repo.
  #
  # E cobre `cancelled()` além de `failure()`: em 06/08 três deploys foram
  # cancelados aos 15m00s cravados sem runner atribuído (cota da conta), e
  # cancelamento por plataforma é tão invisível quanto falha.
  # ══════════════════════════════════════════════════════════════════════════
  avisar-falha:
    needs: deploy
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Deploy falhou — abrir/atualizar issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ═══ POR QUE ISTO VEM POR `env` E NÃO POR `${{ }}` NO MEIO DO SCRIPT ═
          #
          # 13/08: o deploy 470 caiu no `Push image` (infraestrutura) e esta
          # trava caiu junto. A mensagem do commit era interpolada DENTRO do
          # heredoc, e a mensagem daquele squash tinha crases e parênteses
          # (`ehDocumentoDeServico`, `useState(...)`). O bash leu tudo como
          # substituição de comando: dezenas de "command not found", exit 1.
          #
          # `${{ }}` é substituído pelo Actions ANTES de o bash existir: texto de
          # terceiro vira CÓDIGO. Por `env:` o valor chega como variável de
          # ambiente de verdade e nunca é parseado — por isso isto também era
          # vetor de injeção, e não só um bug de aspas.
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          RESULTADO: ${{ needs.deploy.result }}
        run: |
          TITULO="🚨 Deploy do app principal FALHOU — a main não está no ar"
          # Só a PRIMEIRA linha da mensagem: o corpo de um squash é a soma de
          # todos os commits, e um muro de texto na issue esconde a ação.
          RESUMO=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          {
            printf 'O deploy da `main` terminou em **%s**.\n\n' "$RESULTADO"
            printf '**O que está mesclado NÃO está publicado** — quem testar agora vai ver a\n'
            printf 'versão anterior, e um print dessa tela parece defeito de código.\n\n'
            printf '| | |\n| --- | --- |\n'
            printf '| Commit | `%s` |\n' "$COMMIT_SHA"
            printf '| Mensagem | %s |\n' "$RESUMO"
            printf '| Resultado | %s |\n' "$RESULTADO"
            printf '| Run | %s |\n\n' "$RUN_URL"
            printf '**O que fazer**\n'
            printf '1. Abrir o run e ver QUAL passo caiu (o log diz).\n'
            printf '2. Se for o gate (lint/testes/auditoria): corrigir e mesclar de novo.\n'
            printf '3. Se for infraestrutura (download de action, runner, cota, push da\n'
            printf '   imagem, Cloud Run): reexecutar o run. Se persistir, existe a saída de\n'
            printf '   emergência — `scripts/deploy-manual.sh`, que faz o mesmo caminho pelo\n'
            printf '   Cloud Build, com health check antes de rotear. Ela NÃO roda o gate:\n'
            printf '   só use depois do gate verde na máquina.\n\n'
            printf '**Enquanto isto estiver aberto, não confie em print de tela** — confira a\n'
            printf 'versão primeiro (rodapé do app, ou `/guia-conferencia-entregas.html`).\n\n'
            printf '_Esta issue é fechada à mão quando o deploy voltar a passar._\n'
          } > /tmp/corpo-issue.md
          EXISTE=$(gh issue list --repo "$REPO" --search "$TITULO in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTE" ]; then
            # Falhar de novo COMENTA em vez de abrir outra: uma issue por
            # incidente. Enxurrada de issues iguais vira ruído que se ignora —
            # que é exatamente o efeito que esta trava existe pra evitar.
            gh issue comment "$EXISTE" --repo "$REPO" --body-file /tmp/corpo-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITULO" --body-file /tmp/corpo-issue.md
          fi
